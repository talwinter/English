<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Tool</title>
  <style>
    :root { --red: #aa0000; --gray: #aaaaaa; --dgray: #555555; --yellow: #ffff55; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #000; color: #000; font-family: "Segoe UI", Arial, sans-serif; padding: 16px; }
    main { max-width: 1300px; margin: 0 auto; display: grid; gap: 14px; }
    h1 { color: #fff; font-family: Consolas, monospace; margin: 0; font-size: 26px; }
    .box { background: #fff; border: 5px solid #fff; box-shadow: inset 0 0 0 3px var(--red); padding: 16px 20px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end; }
    label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
    select, input[type=number] { font: inherit; padding: 4px 6px; }
    .check { display: flex; gap: 6px; align-items: center; }
    button {
      font: inherit; font-weight: 700; padding: 8px 16px; cursor: pointer; background: var(--gray);
      border: 3px solid; border-color: #fff var(--dgray) var(--dgray) #fff; outline: 2px solid #000;
    }
    button:hover { background: var(--yellow); }
    button:disabled { opacity: .5; cursor: default; }
    #drop { border: 3px dashed var(--dgray); padding: 26px; text-align: center; font-size: 18px; cursor: pointer; }
    #drop.over { background: #ffff99; }
    .views { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .views figure { margin: 0; }
    figcaption { font-weight: 700; margin-bottom: 6px; }
    canvas, img { width: 100%; display: block; background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
    #out { image-rendering: pixelated; }
    #palette { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 8px; }
    #palette span { width: 18px; height: 18px; border: 1px solid #000; }
    .muted { color: var(--dgray); font-size: 14px; }
    @media (max-width: 800px) { .views { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Pixel Tool · English Quest</h1>

  <section class="box">
    <div id="drop">Drop an image here, or click to choose one</div>
    <input type="file" id="file" accept="image/*" hidden>
  </section>

  <section class="box controls">
    <label>Kind
      <select id="kind">
        <option value="background">Background (crop to 16:10)</option>
        <option value="sprite">Character / item (keep shape)</option>
      </select>
    </label>
    <label>Size
      <select id="size">
        <option value="320">320 × 200 (VGA, King's Quest V)</option>
        <option value="480">480 × 300 (sharper)</option>
        <option value="160">160 × 100 (very chunky)</option>
      </select>
    </label>
    <label id="height-wrap" hidden>Sprite height (pixels)
      <input type="number" id="height" value="48" min="8" max="200">
    </label>
    <label>Colors
      <select id="colors">
        <option value="32">32 colors (recommended)</option>
        <option value="64">64 colors</option>
        <option value="16">16 colors</option>
        <option value="ega">EGA 16 (King's Quest I)</option>
      </select>
    </label>
    <label>Dithering
      <select id="dither">
        <option value="0">None</option>
        <option value="12" selected>Light</option>
        <option value="28">Strong</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="magenta"> Remove magenta background</label>
    <button id="save" disabled>Download PNG</button>
  </section>

  <section class="box views">
    <figure><figcaption>Original</figcaption><img id="src" alt=""></figure>
    <figure><figcaption>Pixel art <span id="info" class="muted"></span></figcaption><canvas id="out"></canvas>
      <div id="palette"></div></figure>
  </section>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const EGA = [0x000000, 0x0000aa, 0x00aa00, 0x00aaaa, 0xaa0000, 0xaa00aa, 0xaa5500, 0xaaaaaa,
    0x555555, 0x5555ff, 0x55ff55, 0x55ffff, 0xff5555, 0xff55ff, 0xffff55, 0xffffff].map((c) => [c >> 16, (c >> 8) & 255, c & 255]);
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => v / 16 - 0.47);
  let image = null, name = "image";

  // Is this pixel the magenta "green screen" background?
  const isKey = (r, g, b) => r > 180 && b > 180 && g < 110 && Math.abs(r - b) < 90;

  function shrink(img, w, h, crop, removeKey) {
    const c = document.createElement("canvas");
    c.width = crop.w; c.height = crop.h;
    const cx = c.getContext("2d");
    cx.drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, crop.w, crop.h);
    const src = cx.getImageData(0, 0, crop.w, crop.h).data;
    const out = new Float32Array(w * h * 4);
    const sx = crop.w / w, sy = crop.h / h;
    // Average each block of source pixels (box filter), ignoring the key color.
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let r = 0, g = 0, b = 0, n = 0, all = 0;
        for (let yy = Math.floor(y * sy); yy < Math.floor((y + 1) * sy); yy++) {
          for (let xx = Math.floor(x * sx); xx < Math.floor((x + 1) * sx); xx++) {
            const i = (yy * crop.w + xx) * 4;
            all++;
            if (src[i + 3] < 128 || (removeKey && isKey(src[i], src[i + 1], src[i + 2]))) continue;
            r += src[i]; g += src[i + 1]; b += src[i + 2]; n++;
          }
        }
        const o = (y * w + x) * 4;
        if (n && n >= all / 2) { out[o] = r / n; out[o + 1] = g / n; out[o + 2] = b / n; out[o + 3] = 255; }
      }
    }
    return out;
  }

  // Median cut: split the colors into boxes until we have `count` colors.
  function medianCut(px, count) {
    const colors = [];
    for (let i = 0; i < px.length; i += 4) if (px[i + 3]) colors.push([px[i], px[i + 1], px[i + 2]]);
    let boxes = [colors];
    while (boxes.length < count) {
      let best = -1, bestRange = -1, bestCh = 0;
      boxes.forEach((box, i) => {
        if (box.length < 2) return;
        for (let ch = 0; ch < 3; ch++) {
          let lo = 255, hi = 0;
          for (const c of box) { if (c[ch] < lo) lo = c[ch]; if (c[ch] > hi) hi = c[ch]; }
          const range = (hi - lo) * Math.sqrt(box.length);
          if (range > bestRange) { bestRange = range; best = i; bestCh = ch; }
        }
      });
      if (best < 0) break;
      const box = boxes[best].sort((a, b) => a[bestCh] - b[bestCh]);
      const mid = box.length >> 1;
      boxes.splice(best, 1, box.slice(0, mid), box.slice(mid));
    }
    return boxes.filter((b) => b.length).map((box) => {
      const s = [0, 0, 0];
      for (const c of box) { s[0] += c[0]; s[1] += c[1]; s[2] += c[2]; }
      return s.map((v) => Math.round(v / box.length));
    });
  }

  function nearest(pal, r, g, b) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < pal.length; i++) {
      const p = pal[i], dr = r - p[0], dg = g - p[1], db = b - p[2];
      const d = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
      if (d < bd) { bd = d; best = i; }
    }
    return pal[best];
  }

  function render() {
    if (!image) return;
    const kind = $("#kind").value;
    const W = Number($("#size").value);
    let w, h, crop;
    if (kind === "background") {
      w = W; h = Math.round(W * 10 / 16);
      const target = 16 / 10, ratio = image.width / image.height;
      crop = ratio > target
        ? { w: Math.round(image.height * target), h: image.height }
        : { w: image.width, h: Math.round(image.width / target) };
      crop.x = Math.round((image.width - crop.w) / 2);
      crop.y = Math.round((image.height - crop.h) / 2);
    } else {
      h = Number($("#height").value) || 48;
      w = Math.max(1, Math.round(h * image.width / image.height));
      crop = { x: 0, y: 0, w: image.width, h: image.height };
    }
    const px = shrink(image, w, h, crop, $("#magenta").checked);
    const pal = $("#colors").value === "ega" ? EGA : medianCut(px, Number($("#colors").value));
    const strength = Number($("#dither").value);

    const out = $("#out");
    out.width = w; out.height = h;
    const ctx = out.getContext("2d");
    const data = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (!px[i + 3]) continue;
        const t = BAYER[(y & 3) * 4 + (x & 3)] * strength;
        const [r, g, b] = nearest(pal, px[i] + t, px[i + 1] + t, px[i + 2] + t);
        data.data[i] = r; data.data[i + 1] = g; data.data[i + 2] = b; data.data[i + 3] = 255;
      }
    }
    ctx.putImageData(data, 0, 0);
    $("#info").textContent = `${w} × ${h}, ${pal.length} colors`;
    $("#palette").innerHTML = pal.map(([r, g, b]) => `<span style="background:rgb(${r},${g},${b})"></span>`).join("");
    $("#save").disabled = false;
  }

  function load(file) {
    if (!file || !file.type.startsWith("image/")) return;
    name = file.name.replace(/\.[^.]+$/, "");
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { image = img; $("#src").src = url; render(); };
    img.src = url;
  }

  $("#drop").onclick = () => $("#file").click();
  $("#file").onchange = (e) => load(e.target.files[0]);
  $("#drop").ondragover = (e) => { e.preventDefault(); $("#drop").classList.add("over"); };
  $("#drop").ondragleave = () => $("#drop").classList.remove("over");
  $("#drop").ondrop = (e) => { e.preventDefault(); $("#drop").classList.remove("over"); load(e.dataTransfer.files[0]); };
  $("#kind").onchange = () => {
    const sprite = $("#kind").value === "sprite";
    $("#height-wrap").hidden = !sprite;
    $("#magenta").checked = sprite;
    render();
  };
  ["size", "height", "colors", "dither", "magenta"].forEach((id) => { $("#" + id).oninput = render; });
  $("#save").onclick = () => {
    const a = document.createElement("a");
    a.download = `${name}-pixel.png`;
    a.href = $("#out").toDataURL("image/png");
    a.click();
  };
</script>
</body>
</html>
